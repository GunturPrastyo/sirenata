server {
    listen 80;
    
    # 1. Definisikan server_name secara eksplisit
    server_name sirenata.kemnaker.go.id;

    # 2. Blokir Host Header Injection
    if ($host != "sirenata.kemnaker.go.id") {
        return 444; 
    }

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Menyembunyikan versi Nginx
    server_tokens off;

    # ========================================================
    # SECURITY HEADERS
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    charset utf-8;

    # ========================================================
    # BLOKIR AKSES FILE SENSITIF & LOG LARAVEL
    # ========================================================
    location ~ \.(env|log|sqlite)$ {
        deny all;
        return 404;
    }

    location ~ ^/(storage/logs|.git) {
        deny all;
        return 404;
    }

    # ========================================================
    # PENGATURAN ROUTING LARAVEL
    # ========================================================
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Menyembunyikan versi PHP
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}