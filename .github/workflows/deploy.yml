name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull kode terbaru dari GitHub
            git pull origin main

            # Install dependensi PHP (tanpa dev dependencies)
            docker exec elearning_app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Install dependensi Node dan build assets Vite
            docker exec elearning_app npm install
            docker exec elearning_app npm run build

            # Jalankan migrasi database
            docker exec elearning_app php artisan migrate --force

            # Clear dan rebuild cache
            docker exec elearning_app php artisan config:cache
            docker exec elearning_app php artisan route:cache
            docker exec elearning_app php artisan view:cache
            docker exec elearning_app php artisan event:cache

            # Restart queue workers (jika ada)
            docker exec elearning_app php artisan queue:restart
